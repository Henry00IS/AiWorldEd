name: CI and desktop artifacts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiworlded-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run unit tests
        run: bun run testrun

      # Embed the same CI version into package.json before the web production build so
      # GitHub Pages shows "Version: 1.<run>.0" instead of the repo placeholder 1.0.0.
      - name: Assign application version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION="$(bun scripts/ci_release_version.ts --write)"
          echo "Web release version: ${VERSION}"

      - name: Build web bundle
        run: bun run build

      # Favicons live in public/ and are copied into docs/ by Vite on every
      # build (relative links in index.html / site.webmanifest). No restore step.

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Run strict TypeScript check
        continue-on-error: true
        run: bun run typecheck:strict

  e2e:
    name: Cypress E2E
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: bun install --frozen-lockfile

      - name: Install Cypress binary
        run: bun x cypress install

      # The build embeds the E2E test bridge the specs drive.
      - name: Build web bundle
        run: bun run e2e:build

      - name: Serve production build and wait for it
        shell: bash
        run: |
          nohup bun run e2e:preview > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4173; then
              echo "preview server ready"
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not start" >&2
          cat preview.log >&2
          exit 1

      - name: Run Cypress specs
        run: bun x cypress run --browser chrome

      - name: Upload failure videos and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-run-recordings
          path: |
            cypress/videos
            cypress/screenshots
          if-no-files-found: ignore

  desktop-build:
    name: Build ${{ matrix.platform }} desktop artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: bun install --frozen-lockfile

      # Embed 1.<run_number>.0 into package.json before Electrobun packages the app.
      - name: Assign desktop release version
        id: version
        shell: bash
        run: |
          VERSION="$(bun scripts/ci_release_version.ts --write)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Desktop release version: ${VERSION}"

      - name: Build Electrobun package
        run: bun run desktop:build

      # Versioned Setup for humans + Electrobun-named portable/update.json for auto-update.
      - name: Package clean release assets
        shell: bash
        run: |
          bun scripts/package_desktop_release.ts \
            --version "${{ steps.version.outputs.version }}" \
            --input desktop_artifacts \
            --output release_dist

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiworlded-${{ matrix.platform }}-${{ github.sha }}
          path: release_dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Automatic Release
    needs: desktop-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(bun scripts/ci_release_version.ts)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: aiworlded-*
          path: release_assets/
          merge-multiple: true

      - name: Compose release notes
        shell: bash
        run: |
          bun scripts/compose_release_notes.ts \
            --version "${{ steps.version.outputs.version }}" \
            --assets release_assets \
            --sha "${{ github.sha }}" \
            --out release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 'AI World Editor v${{ steps.version.outputs.version }}'
          body_path: release_body.md
          files: release_assets/**/*
          generate_release_notes: false

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
